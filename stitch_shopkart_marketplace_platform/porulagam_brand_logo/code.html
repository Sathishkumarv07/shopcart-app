<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54" fill="none">
  <defs>
    <!-- Brand Primary Gradient matching Design System #1e50d8 -->
    <linearGradient id="brandKartGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="sparkAccent" x1="0" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Icon Container -->
  <rect x="4" y="6" width="42" height="42" rx="12" fill="url(#brandKartGrad)" filter="url(#badgeShadow)"/>
  
  <!-- Dynamic Fast Commerce Cart -->
  <path d="M14 17h3.6l2.6 12h13.2l2.4-9H19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="21.5" cy="34" r="2.2" fill="#ffffff"/>
  <circle cx="30.5" cy="34" r="2.2" fill="#ffffff"/>
  <!-- Express / Flash lightning bolt accent inside cart -->
  <path d="M29 13l-4.5 6.5h5.5l-3.5 6.5 8-7.5h-5.5z" fill="url(#sparkAccent)"/>

  <!-- Crisp, authentic Tamil Typography: பொருளகம் -->
  <text x="56" y="30" font-family="'Noto Sans Tamil', 'Mukta Malar', 'Latha', 'Tamil Sangam MN', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.4">பொருளகம்</text>
  
  <!-- Modern clean subtitle tag with letter spacing -->
  <text x="57" y="44" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="9" font-weight="700" fill="#2563eb" letter-spacing="1.8">PORULAGAM</text>
</svg>
