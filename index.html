<!DOCTYPE html>
<html lang="ta" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e50d8" />
  <meta name="description" content="பொருளகம் (Porulagam) - High-velocity retail marketplace for electronics, smartphones, fashion, home essentials & daily deals." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

      theme: {
        extend: {
          colors: {
            "surface": "#faf8ff",
            "surface-dim": "#d2d9f4",

            "primary-fixed": "#dce1ff",

            "label-sm": ["Inter", "sans-serif"]

        }
      }

<body class="bg-surface text-on-surface flex flex-col antialiased min-h-screen">
  
  <div id="app" class="flex flex-col min-h-screen relative w-full">
    <!-- Header Target -->
    <div id="header-container"></div>

    <!-- Main View Target with Top & Bottom Safe Spacing -->
    <main id="main-view-container" class="flex-1 w-full pt-28 md:pt-20 pb-20 bg-surface"></main>

    <!-- Bottom Nav Target -->
    <div id="bottom-nav-container"></div>

    <!-- Modals Target -->
    <div id="modals-container"></div>

    <!-- Toast Notification Target -->
    <div id="toast-container"></div>
  </div>
