<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D8C"/>
      <stop offset="50%" stop-color="#0039B1"/>
      <stop offset="100%" stop-color="#1E50D8"/>
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="45%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>

    <!-- Emerald / Mint Accent -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00A86B"/>
    </linearGradient>

    <!-- Bag Body Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001845" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Decorative Modern Geometric Geometry / Grid Glow -->
  <circle cx="430" cy="80" r="140" fill="url(#goldGrad)" opacity="0.18" filter="url(#glow)"/>
  <circle cx="80" cy="440" r="160" fill="url(#emeraldGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Subtle Speed / Arc swoosh representing high velocity marketplace -->
  <path d="M 64 256 C 120 120, 360 80, 448 180" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4" stroke-dasharray="16 12"/>

  <!-- Main Shopping Bag Base Group with Shadow -->
  <g filter="url(#softShadow)">
    <!-- Bag Handle -->
    <path d="M 186 180 C 186 100, 326 100, 326 180" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="24" 
          stroke-linecap="round"/>

    <!-- Bag Body -->
    <path d="M 120 180 
             C 120 165, 132 155, 148 155 
             L 364 155 
             C 380 155, 392 165, 392 180 
             L 416 385 
             C 418 415, 395 435, 365 435 
             L 147 435 
             C 117 435, 94 415, 96 385 
             Z" 
          fill="url(#bagGrad)"/>

    <!-- Stylish Bag Fold / Accent Line -->
    <path d="M 124 195 L 388 195" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

    <!-- Golden Fast Drop Sparkle / Growth Arrow in Center -->
    <!-- Stylized "பொ" letterform combined with Shopping Cart / Fast Delivery Ribbon -->
    <g transform="translate(256, 305)">
      <!-- Central Golden Coin Badge -->
      <circle cx="0" cy="0" r="68" fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="56" fill="#0039B1"/>

      <!-- Tamil 'பொ' Stylized Emblem / Super Spark -->
      <!-- Dynamic Modern 'P' monogram + Star -->
      <path d="M -24 -30 L 10 -30 C 26 -30, 36 -20, 36 -6 C 36 8, 26 18, 10 18 L -10 18 L -10 32 L -24 32 Z M -10 -16 L 8 -16 C 15 -16, 21 -13, 21 -6 C 21 1, 15 4, 8 4 L -10 4 Z" fill="url(#goldGrad)"/>
      <polygon points="18,-18 24,-6 36,-6 26,2 30,14 18,7 8,14 11,2 2,-6 14,-6" fill="#FFFFFF" transform="scale(0.55) translate(28, -25)"/>
    </g>

    <!-- Offer Sale Tag on Bag Corner -->
    <g transform="translate(365, 175) rotate(15)">
      <rect x="-35" y="-18" width="70" height="36" rx="10" fill="url(#emeraldGrad)"/>
      <circle cx="-20" cy="0" r="4" fill="#FFFFFF"/>
      <text x="5" y="6" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">%</text>
    </g>
  </g>
</svg>
